<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcador de Edades</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B4735">
<meta name="description" content="Registra niños y los ubica automáticamente por grupo de edad.">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Edades">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#2B4735;
    --board-line: rgba(247,245,239,0.35);
    --chalk:#F7F5EF;
    --panel:#FFFFFF;
    --ink:#1E2A22;
    --muted:#5B6B60;
    --line:#E1DFD3;

    --adolescente:#C9503F;
    --preadolescente:#D89A2B;
    --escolar:#3E7F91;
    --preescolar:#5C8C43;
    --bebe:#7C5FA0;
    --adulto:#8A8478;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--chalk);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Baloo 2', sans-serif;
    margin:0;
    line-height:1.15;
  }
  button{ font-family:inherit; }

  :focus-visible{
    outline:3px solid #2E6E80;
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  /* ---------- Hero ---------- */
  .hero{
    background:var(--board);
    color:var(--chalk);
    padding:2.75rem 1.5rem 2.25rem;
    display:flex;
    align-items:center;
    gap:2rem;
    flex-wrap:wrap;
  }
  .hero-text{ flex:1 1 280px; min-width:260px; }
  .hero h1{
    font-size:clamp(1.9rem, 4vw, 2.6rem);
    font-weight:700;
    letter-spacing:0.2px;
  }
  .hero p{
    margin:0.6rem 0 0;
    max-width:46ch;
    color:rgba(247,245,239,0.82);
    font-size:1rem;
  }
  .ruler{
    flex:0 0 auto;
    width:min(320px, 100%);
  }
  .ruler svg{ width:100%; height:auto; display:block; }
  .ruler text{
    font-family:'Work Sans', sans-serif;
    font-size:9px;
    fill:rgba(247,245,239,0.7);
  }
  .ruler line{ stroke:var(--board-line); }

  /* ---------- Board layout ---------- */
  .board{
    max-width:1080px;
    margin:0 auto;
    padding:1.75rem 1.25rem 4rem;
    display:grid;
    grid-template-columns:320px 1fr;
    gap:1.75rem;
    align-items:start;
  }
  @media (max-width:820px){
    .board{ grid-template-columns:1fr; padding:1.25rem 1rem 3rem; }
  }

  /* ---------- Entry panel ---------- */
  .entry-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:1.5rem;
    position:sticky;
    top:1.25rem;
  }
  @media (max-width:820px){ .entry-panel{ position:static; } }

  .entry-panel h2{ font-size:1.25rem; margin-bottom:0.9rem; }

  .field{ display:block; margin-bottom:1rem; }
  .field span{
    display:block;
    font-size:0.85rem;
    font-weight:600;
    color:var(--muted);
    margin-bottom:0.35rem;
  }
  .field input{
    width:100%;
    padding:0.65rem 0.75rem;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-size:1rem;
    color:var(--ink);
    background:#FCFBF8;
  }
  .field input:focus{ border-color:#2E6E80; }

  .preview{
    font-size:0.9rem;
    color:var(--muted);
    background:#F1EFE6;
    border-radius:9px;
    padding:0.6rem 0.75rem;
    margin-bottom:1rem;
    display:flex;
    align-items:center;
    gap:0.5rem;
  }
  .preview .dot{
    width:10px; height:10px; border-radius:50%;
    flex:0 0 auto;
  }
  .preview strong{ color:var(--ink); }

  .add-btn{
    width:100%;
    background:var(--board);
    color:var(--chalk);
    border:none;
    border-radius:9px;
    padding:0.75rem 1rem;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .add-btn:hover{ background:#213B2A; }
  .add-btn:disabled{ background:#A9B4AC; cursor:not-allowed; }

  .error-msg{
    font-size:0.85rem;
    color:#B23A2E;
    margin:-0.4rem 0 1rem;
    display:none;
  }
  .error-msg.show{ display:block; }

  .total-count{
    margin-top:1.1rem;
    font-size:0.85rem;
    color:var(--muted);
    text-align:center;
  }

  /* ---------- Wall of bands ---------- */
  .wall{ display:flex; flex-direction:column; gap:0.9rem; }

  .band{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:6px solid var(--band-color, var(--muted));
    border-radius:10px;
    padding:1rem 1.1rem;
  }
  .band-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:0.75rem;
    flex-wrap:wrap;
    margin-bottom:0.65rem;
  }
  .band-head h3{
    font-size:1.05rem;
    color:var(--ink);
  }
  .band-head .range{
    font-size:0.82rem;
    color:var(--muted);
    font-family:'Work Sans', sans-serif;
  }
  .band-head .count{
    font-size:0.8rem;
    color:var(--band-color, var(--muted));
    font-weight:600;
  }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:0.5rem;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:0.45rem;
    background:#F5F3EA;
    border-radius:20px;
    padding:0.4rem 0.5rem 0.4rem 0.8rem;
    font-size:0.88rem;
    animation:settle 0.25s ease;
  }
  @keyframes settle{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .chip .age{ color:var(--muted); font-size:0.8rem; }
  .chip button{
    border:none;
    background:transparent;
    color:var(--muted);
    width:20px; height:20px;
    border-radius:50%;
    cursor:pointer;
    line-height:1;
    font-size:0.95rem;
    display:flex; align-items:center; justify-content:center;
  }
  .chip button:hover{ background:#E7E4D8; color:var(--ink); }

  .band-empty{
    font-size:0.86rem;
    color:var(--muted);
    font-style:italic;
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-text">
    <h1>Marcador de Edades</h1>
    <p>Anota el nombre y la edad de cada niño y su marca aparece sola en el grupo que le corresponde, como en la pared donde se mide la estatura.</p>
  </div>
  <div class="ruler" aria-hidden="true">
    <svg viewBox="0 0 300 80">
      <line x1="10" y1="40" x2="290" y2="40" stroke-width="1.5"/>
      <g>
        <!-- ticks at 0,3,6,9,12,15,18 -->
        <line x1="10"  y1="26" x2="10"  y2="54" stroke-width="1.5"/>
        <line x1="55"  y1="30" x2="55"  y2="50" stroke-width="1.2"/>
        <line x1="100" y1="26" x2="100" y2="54" stroke-width="1.5"/>
        <line x1="145" y1="30" x2="145" y2="50" stroke-width="1.2"/>
        <line x1="190" y1="26" x2="190" y2="54" stroke-width="1.5"/>
        <line x1="235" y1="30" x2="235" y2="50" stroke-width="1.2"/>
        <line x1="280" y1="26" x2="280" y2="54" stroke-width="1.5"/>
        <text x="10"  y="68" text-anchor="middle">0</text>
        <text x="55"  y="68" text-anchor="middle">3</text>
        <text x="100" y="68" text-anchor="middle">6</text>
        <text x="145" y="68" text-anchor="middle">9</text>
        <text x="190" y="68" text-anchor="middle">12</text>
        <text x="235" y="68" text-anchor="middle">15</text>
        <text x="280" y="68" text-anchor="middle">18</text>
      </g>
    </svg>
  </div>
</header>

<main class="board">
  <section class="entry-panel">
    <h2>Nuevo registro</h2>
    <form id="childForm" novalidate>
      <label class="field">
        <span>Nombre</span>
        <input type="text" id="nameInput" placeholder="Ej. Camila" autocomplete="off" required>
      </label>
      <label class="field">
        <span>Edad (años)</span>
        <input type="number" id="ageInput" placeholder="Ej. 7" min="0" max="99" required>
      </label>

      <p class="error-msg" id="errorMsg">Escribe un nombre y una edad válida (0 a 99).</p>

      <div class="preview" id="preview" hidden>
        <span class="dot" id="previewDot"></span>
        <span>Quedará marcado en <strong id="previewLabel"></strong></span>
      </div>

      <button type="submit" class="add-btn">Agregar a la pared</button>
    </form>
    <p class="total-count" id="totalCount">Aún no hay niños registrados.</p>
  </section>

  <section class="wall" id="wall" aria-live="polite"></section>
</main>

<script>
  const CATEGORIES = [
    { id:'adulto',         label:'Adultos (fuera de rango)', range:'18+ años',     min:18, max:200, color:'var(--adulto)' },
    { id:'adolescente',    label:'Adolescentes',              range:'15–17 años',   min:15, max:17,  color:'var(--adolescente)' },
    { id:'preadolescente', label:'Preadolescentes',           range:'12–14 años',   min:12, max:14,  color:'var(--preadolescente)' },
    { id:'escolar',        label:'Niños escolares',           range:'6–11 años',    min:6,  max:11,  color:'var(--escolar)' },
    { id:'preescolar',     label:'Preescolares',              range:'3–5 años',     min:3,  max:5,   color:'var(--preescolar)' },
    { id:'bebe',           label:'Bebés',                     range:'0–2 años',     min:0,  max:2,   color:'var(--bebe)' },
  ];

  function categoryForAge(age){
    return CATEGORIES.find(c => age >= c.min && age <= c.max) || CATEGORIES[CATEGORIES.length - 1];
  }

  let children = [];
  let nextId = 1;

  const form = document.getElementById('childForm');
  const nameInput = document.getElementById('nameInput');
  const ageInput = document.getElementById('ageInput');
  const preview = document.getElementById('preview');
  const previewLabel = document.getElementById('previewLabel');
  const previewDot = document.getElementById('previewDot');
  const errorMsg = document.getElementById('errorMsg');
  const wall = document.getElementById('wall');
  const totalCount = document.getElementById('totalCount');

  function updatePreview(){
    const age = Number(ageInput.value);
    if(ageInput.value === '' || isNaN(age) || age < 0){
      preview.hidden = true;
      return;
    }
    const cat = categoryForAge(age);
    previewLabel.textContent = cat.label;
    previewDot.style.background = cat.color;
    preview.hidden = false;
  }
  ageInput.addEventListener('input', updatePreview);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    const age = Number(ageInput.value);

    if(!name || ageInput.value === '' || isNaN(age) || age < 0 || age > 99){
      errorMsg.classList.add('show');
      return;
    }
    errorMsg.classList.remove('show');

    children.push({ id: nextId++, name, age, justAdded: true });
    nameInput.value = '';
    ageInput.value = '';
    preview.hidden = true;
    render();
    nameInput.focus();
  });

  function removeChild(id){
    children = children.filter(c => c.id !== id);
    render();
  }

  function render(){
    wall.innerHTML = '';

    CATEGORIES.forEach(cat => {
      const members = children.filter(c => c.age >= cat.min && c.age <= cat.max);
      if(cat.id === 'adulto' && members.length === 0) return; // hide empty adult band unless used

      const band = document.createElement('article');
      band.className = 'band';
      band.style.setProperty('--band-color', cat.color);

      const head = document.createElement('div');
      head.className = 'band-head';
      head.innerHTML = `
        <h3>${cat.label}</h3>
        <span class="range">${cat.range}</span>
        <span class="count">${members.length} ${members.length === 1 ? 'niño' : 'niños'}</span>
      `;
      band.appendChild(head);

      if(members.length === 0){
        const empty = document.createElement('p');
        empty.className = 'band-empty';
        empty.textContent = 'Aún nadie en este grupo.';
        band.appendChild(empty);
      } else {
        const chips = document.createElement('div');
        chips.className = 'chips';
        members
          .slice()
          .sort((a,b) => a.age - b.age || a.name.localeCompare(b.name))
          .forEach(child => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.innerHTML = `${escapeHtml(child.name)} <span class="age">${child.age}a</span>`;
            const del = document.createElement('button');
            del.type = 'button';
            del.setAttribute('aria-label', `Quitar a ${child.name}`);
            del.textContent = '×';
            del.addEventListener('click', () => removeChild(child.id));
            chip.appendChild(del);
            chips.appendChild(chip);
          });
        band.appendChild(chips);
      }

      wall.appendChild(band);
    });

    totalCount.textContent = children.length === 0
      ? 'Aún no hay niños registrados.'
      : `${children.length} ${children.length === 1 ? 'niño registrado' : 'niños registrados'} en total.`;
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, m => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[m]));
  }

  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        console.log('No se pudo registrar el service worker:', err);
      });
    });
  }
</script>

</body>
</html>
